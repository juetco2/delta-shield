<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeltaShield Threat Intercept</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      max-width: 680px;
      width: 100%;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1f2937;
    }
    .shield-icon {
      width: 52px;
      height: 52px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #06b6d4;
      font-weight: 600;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }
    .target-box {
      background: #0b0f19;
      border: 1px solid #1f2937;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .target-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }
    .target-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #f87171;
    }
    .threat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .threat-stat {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 16px;
      border-radius: 8px;
    }
    .threat-stat-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .threat-stat-val {
      font-size: 20px;
      font-weight: 700;
      color: #ef4444;
      font-variant-numeric: tabular-nums;
    }
    .tags-section {
      margin-bottom: 28px;
      font-size: 13px;
      color: #94a3b8;
    }
    .tags-section strong {
      color: #e2e8f0;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-safety {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .btn-safety:hover { background: #1d4ed8; }
    .btn-bypass {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .btn-bypass:hover {
      background: rgba(239, 68, 68, 0.08);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .permalink-link {
      color: #06b6d4;
      text-decoration: none;
      font-size: 12px;
      display: inline-block;
      margin-top: 6px;
    }
    .permalink-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="shield-icon">
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">DeltaShield Threat Defense</div>
        <h1>Security Threat Intercepted</h1>
      </div>
    </div>

    <div class="target-box">
      <div class="target-label" id="type-label">Suspicious Target URL</div>
      <div class="target-url" id="target-display">Analyzing...</div>
    </div>

    <div class="threat-grid">
      <div class="threat-stat">
        <div class="threat-stat-title">Malicious Engine Detections</div>
        <div class="threat-stat-val" id="malicious-count">0 Detections</div>
      </div>
      <div class="threat-stat">
        <div class="threat-stat-title">Risk Assessment</div>
        <div class="threat-stat-val" style="color: #f87171;">High Threat</div>
      </div>
    </div>

    <div class="tags-section">
      <div><strong>Identified Signatures:</strong> <span id="threat-names">Phishing / Malicious Payload</span></div>
      <div id="permalink-container"></div>
    </div>

    <div class="actions">
      <button class="btn-safety" id="btn-back">Return to Safety (Recommended)</button>
      <button class="btn-bypass" id="btn-bypass">I understand the risks, bypass and proceed</button>
    </div>
  </div>

  <script src="intercept.js"></script>
</body>
</html>
